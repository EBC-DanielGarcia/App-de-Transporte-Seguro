[pytest]
# Configuración de pytest para el Sistema de Monitoreo de Transporte

# Directorio de tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Opciones de salida
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing

# Marcadores personalizados
markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    property: Pruebas de propiedad
    slow: Pruebas lentas
